name: Release

# Release bauen: Tag im Format v* pushen (z. B. v1.0.0).
# Manueller Lauf (workflow_dispatch) baut nur und lädt die Zips als Artefakte hoch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish (Apple Silicon)
        run: build/publish-macos.sh osx-arm64

      - name: Publish (Intel)
        run: build/publish-macos.sh osx-x64

      - name: Zip app bundles
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/osx-arm64/RechnungsTool.app "dist/RechnungsTool-${{ github.ref_name }}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/osx-x64/RechnungsTool.app   "dist/RechnungsTool-${{ github.ref_name }}-macos-x64.zip"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/RechnungsTool-*.zip \
            --title "RechnungsTool ${{ github.ref_name }}" \
            --generate-notes \
            --notes "$(cat <<'EOF'
          ## Installation (macOS)

          1. Passende Zip laden: **arm64** für Apple Silicon (M1–M4), **x64** für Intel
          2. Entpacken und `RechnungsTool.app` nach **Programme** ziehen
          3. Einmalig die Gatekeeper-Quarantäne entfernen (App ist nicht notarisiert):

             ```
             xattr -cr /Applications/RechnungsTool.app
             ```
          EOF
          )"

      - name: Upload artifacts (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: RechnungsTool-macos
          path: dist/RechnungsTool-*.zip
